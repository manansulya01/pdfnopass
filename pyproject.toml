[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-recovery"
version = "1.0.1"
description = "Universal offline PDF password-recovery utility (local-only, legitimate decryption verification)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "password-recovery", "offline", "pypdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=4.0.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
pdf-recovery = "pdf_recovery.cli:main"

[project.urls]
Homepage = "https://example.com/pdf-recovery"
Repository = "https://example.com/pdf-recovery"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_recovery*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
